[build-system]
requires = ["setuptools>=75.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cms-hte-patient-matching"
dynamic = ["version"]
description = "CMS Patient Matching implementation with deterministic matching rules"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "icanbwell" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12"
dependencies = [
    "rapidfuzz>=3.9.4",
    "usaddress>=0.5.10",
    "usaddress-scourgify>=0.6.0",
    "phonenumbers>=8.13.40",
    "phonetics>=1.0.5",
    "nicknames>=1.0.0",
    "text-unidecode>=1.3",
    "fhirschemapy>=0.0.11",
    "httpx>=0.28.0",
    "duckdb>=1.2.0",
    "apscheduler>=3.10.0",
]

[project.urls]
Homepage = "https://github.com/icanbwell/cms-hte-patient-matching"
Repository = "https://github.com/icanbwell/cms-hte-patient-matching"

[project.optional-dependencies]
fhir = ["httpx", "fhirschemapy"]
cache = ["duckdb", "rapidfuzz"]
mongo = ["pymongo>=4.7"]
scheduler = ["apscheduler"]
all = [
    "httpx",
    "fhirschemapy",
    "duckdb",
    "rapidfuzz",
    "pymongo>=4.7",
    "apscheduler",
]

[dependency-groups]
dev = [
    "setuptools>=83.0.0",
    "wheel>=0.43.0",
    "twine>=4.0.2",
    "pre-commit>=3.6.1",
    "autoflake>=2.2.0",
    "mypy>=1.8.0",
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "black>=24.2.0",
    "bandit>=1.8.3",
    # Pinned exactly (not >=) -- .pre-commit-config.yaml's ruff hooks use
    # `language: system`, running whatever's in this project's own venv, not an
    # isolated pre-commit environment. An open floor let this migration's
    # unrelated uv.lock regeneration silently pick up ruff 0.16.2 (new lint
    # rules, 593 findings) over the previously-locked 0.15.20 -- pinning avoids
    # bundling an unrelated tooling upgrade into this PR's scope.
    "ruff==0.15.20",
    "pytest-cov>=6.1.1",
    # For MongoAtlasCache's testcontainer tests (mongodb-atlas-local) -- session_12.
    "testcontainers>=4.9.0",
    "docker>=7.1.0",
    "pip-licenses>=5.0.0",
]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
include = ["patient_matching*"]
exclude = ["patient_matching.*.tests", "patient_matching.*.tests.*"]

[tool.setuptools.package-data]
patient_matching = ["py.typed"]

[[tool.uv.index]]
name = "jfrog"
url = "https://artifacts.bwell.com/artifactory/api/pypi/virtual-pypi/simple"
default = true

[tool.pytest.ini_options]
addopts = "--capture=fd"
log_cli = true
log_cli_level = "INFO"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["setuptools.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["text_unidecode.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scourgify.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["nicknames.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["duckdb.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["rapidfuzz.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["fhirschemapy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["psycopg2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["elasticsearch.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["redis.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pymongo.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["testcontainers.*", "docker.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# fastapi isn't a project dependency (removed in session 15 -- this repo has no HTTP
# layer of its own) -- patient_matching/fuzzy/examples/fastapi_integration.py is an
# optional, install-it-yourself example for the unrelated fuzzy-search module, same as
# the psycopg2/elasticsearch/redis overrides above for its other optional backends.
module = ["fastapi.*"]
ignore_missing_imports = true
