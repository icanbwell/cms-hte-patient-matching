[project]
name = "patient_matching"
version = "0.1.0"
description = "CMS Patient Matching implementation with deterministic matching rules"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyjwt>=2.8.0",
    "cryptography>=43.0.0",
    "rapidfuzz>=3.9.4",
    "usaddress>=0.5.10",
    "usaddress-scourgify>=0.6.0",
    "phonenumbers>=8.13.40",
    "phonetics>=1.0.5",
    "nominally>=1.1.0",
    "nicknames>=1.0.0",
    "text-unidecode>=1.3",
    "fhirschemapy>=0.0.11",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "httpx>=0.28.0",
    "duckdb>=1.2.0",
    "apscheduler>=3.10.0",
]

[project.optional-dependencies]
fhir = ["httpx", "fhirschemapy"]
cache = ["duckdb", "rapidfuzz"]
api = ["fastapi", "uvicorn"]
scheduler = ["apscheduler"]
all = [
    "httpx",
    "fhirschemapy",
    "duckdb",
    "rapidfuzz",
    "fastapi",
    "uvicorn",
    "apscheduler",
]

[dependency-groups]
dev = [
    "setuptools>=60.9.3",
    "wheel>=0.43.0",
    "twine>=4.0.2",
    "pre-commit>=3.6.1",
    "autoflake>=2.2.0",
    "mypy>=1.8.0",
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "black>=24.2.0",
    "bandit>=1.8.3",
    "ruff>=0.11.5",
    "pytest-cov>=6.1.1",
]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[[tool.uv.index]]
name = "jfrog"
url = "https://artifacts.bwell.com/artifactory/api/pypi/virtual-pypi/simple"
explicit = true

[tool.uv.sources]
# Private packages hosted on JFrog (not available on PyPI)
# fhirschemapy requires JFrog

[tool.pytest.ini_options]
addopts = "--capture=fd"
log_cli = true
log_cli_level = "INFO"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["setuptools.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["text_unidecode.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scourgify.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["nicknames.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["duckdb.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["rapidfuzz.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["fhirschemapy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["psycopg2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["elasticsearch.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["redis.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pymongo.*"]
ignore_missing_imports = true
