[tool:pytest]
addopts = --capture=fd
log_cli = true
log_cli_level = INFO
; all discovered async tests are considered asyncio-driven
asyncio_mode = auto
asyncio_default_fixture_loop_scope= function
[mypy]
python_version = 3.12
warn_return_any = True
warn_unused_configs = True
[mypy-setuptools.*]
ignore_missing_imports = True
[mypy-text_unidecode.*]
ignore_missing_imports = True
[mypy-scourgify.*]
ignore_missing_imports = True
[mypy-nicknames.*]
ignore_missing_imports = True
[mypy-nominally.*]
ignore_missing_imports = True
[mypy-phonetics.*]
ignore_missing_imports = True
[mypy-usaddress.*]
ignore_missing_imports = True
[mypy-apscheduler.*]
ignore_missing_imports = True
[mypy-duckdb.*]
ignore_missing_imports = True
[mypy-rapidfuzz.*]
ignore_missing_imports = True
[mypy-fhirschemapy.*]
ignore_missing_imports = True
[flake8]
ignore = E501, W503, W504, E126, E123
exclude = venv/
